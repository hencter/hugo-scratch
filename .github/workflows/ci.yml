# ============================================================================
#  Verify — the same gate a human or an agent runs locally.
# ----------------------------------------------------------------------------
#  Nothing here is bespoke: `npm ci`, one strict Hugo build, then the site audit
#  the Hugo documentation recommends. The point is that CI cannot be more
#  forgiving than the repository, so a warning that fails locally fails here too.
#
#  Two checkout settings are load-bearing:
#    · submodules: recursive — the theme is a git submodule; without it the build
#      fails with `found no layout file for "html" for kind "page"`;
#    · fetch-depth: 0 — enableGitInfo = true makes "last updated" a fact read from
#      the commit history, and a shallow clone would silently fall back to the
#      front-matter dates.
# ============================================================================

name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  HUGO_VERSION: 0.167.0

jobs:
  strict-build:
    name: Strict build and site audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out, with the theme submodule and full history
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      # The Tailwind CSS v4 CLI is an npm dependency at the site root. It is not
      # part of Hugo, so the build cannot succeed without this step.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Hugo (standard edition — the theme needs no extended features)
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz" -o hugo.tar.gz
          tar -xzf hugo.tar.gz hugo
          sudo install -m 0755 hugo /usr/local/bin/hugo
          hugo version

      - name: Strict build
        run: |
          hugo --ignoreCache \
               --panicOnWarning \
               --printPathWarnings \
               --printUnusedTemplates \
               --printI18nWarnings

      # The audit surfaces two classes of problem that are silent by default:
      # leaked shortcode placeholders and missing-translation placeholders.
      #
      # Two exclusions, both deliberate:
      #   · the site DOCUMENTS the strings this searches for (the audit is
      #     explained in the feature-matrix, navigation and Markdown pages), so
      #     those pages are excluded by path — otherwise the audit fails on its
      #     own documentation;
      #   · public/search.json embeds page bodies by design, so it inherits
      #     whatever those pages say. It is derived output: auditing the HTML and
      #     the Markdown twins already covers every page.
      # The shortcode-placeholder literal cannot appear in content at all (it
      # aborts the build), so it needs no exclusion and can be searched in full.
      - name: Site audit
        run: |
          set -euo pipefail
          HUGO_MINIFY_TDEWOLFF_HTML_KEEPCOMMENTS=true \
          HUGO_ENABLEMISSINGTRANSLATIONPLACEHOLDERS=true \
            hugo --ignoreCache

          scan() {
            local needle="$1" why="$2" hits
            hits=$(grep -rn --binary-files=text --fixed-strings "$needle" public/ \
              | grep -v '/docs/reference/feature-matrix/' \
              | grep -v '/docs/configuration/navigation/' \
              | grep -v '/docs/content/markdown/' \
              | grep -v '/search.json:' \
              || true)
            if [ -n "$hits" ]; then
              echo "::error::$why"
              echo "$hits" | head -20
              exit 1
            fi
          }

          scan "HAHAHUGOSHORTCODE" "leaked shortcode placeholder in the build output"
          scan "MISSING_TRANSLATION" "missing-translation placeholder in the build output"
          scan "raw HTML omitted" "HTML was discarded — check markup.goldmark.renderer.unsafe"

      - name: Report the rendered page count
        run: |
          echo "HTML pages: $(find public -name index.html | wc -l)"
          echo "Markdown twins: $(find public -name index.md | wc -l)"
          echo "Machine-readable: $(ls public/llms.txt public/pages.json public/search.json public/sitemap.xml 2>/dev/null | tr '\n' ' ')"
