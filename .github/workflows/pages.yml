# ============================================================================
#  Deploy to GitHub Pages
# ----------------------------------------------------------------------------
#  A GitHub Pages PROJECT site: the repository publishes to
#  https://<owner>.github.io/<repo>/, and `baseURL` in config/_default/hugo.toml
#  already carries that subpath, so every canonical URL, Open Graph tag and
#  sitemap entry is correct without extra flag juggling.
#
#  Repository settings this workflow assumes: Settings → Pages → Source =
#  "GitHub Actions". No gh-pages branch is used and no CNAME file is needed.
#
#  The build is the same strict build CI runs, so a warning stops the deploy
#  rather than publishing a page with a dead link.
# ============================================================================

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue them instead of cancelling, so a deploy that
# has already started is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.167.0

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out, with the theme submodule and full history
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Hugo
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz" -o hugo.tar.gz
          tar -xzf hugo.tar.gz hugo
          sudo install -m 0755 hugo /usr/local/bin/hugo
          hugo version

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Strict build
        run: |
          hugo --ignoreCache \
               --panicOnWarning \
               --printPathWarnings \
               --printUnusedTemplates \
               --printI18nWarnings \
               --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
