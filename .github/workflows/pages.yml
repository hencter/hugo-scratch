# ============================================================================
#  Deploy to GitHub Pages
# ----------------------------------------------------------------------------
#  The site is published on the custom domain configured under
#  Settings → Pages (here: https://scratch.hugozh.cn/), which serves it from
#  the ROOT of that host, so no generated URL carries a subpath.
#
#  `--baseURL` below takes the address from the Pages API instead of from the
#  config file, so a deployed build always matches the domain the repository is
#  actually configured with: the custom domain when one is set, and otherwise
#  the project-site address https://<owner>.github.io/<repo>/ with its subpath.
#  The value in config/_default/hugo.toml is what local and CI builds use, and
#  the two must describe the same site — a mismatch shows up as 404s for the
#  stylesheet and the scripts, not as a build error.
#
#  Repository settings this workflow assumes: Settings → Pages → Source =
#  "GitHub Actions", plus the custom domain. No gh-pages branch is used and no
#  CNAME file is needed.
#
#  The build is the same strict build CI runs, so a warning stops the deploy
#  rather than publishing a page with a dead link.
# ============================================================================

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue them instead of cancelling, so a deploy that
# has already started is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.167.0

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out, with the theme submodule and full history
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Hugo
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz" -o hugo.tar.gz
          tar -xzf hugo.tar.gz hugo
          sudo install -m 0755 hugo /usr/local/bin/hugo
          hugo version

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Strict build
        run: npm run build -- --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
