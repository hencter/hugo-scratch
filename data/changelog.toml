# ============================================================================
#  Changelog data
# ----------------------------------------------------------------------------
#  This file is the single source of truth for the /changelog/ section:
#
#    · content/changelog/_content.gotmpl turns every entry into a real page at
#      build time (a "content adapter" — no Markdown file per release, and no
#      chance of the list and the pages disagreeing);
#    · the {{< changelog >}} shortcode renders the same entries inline, which is
#      how the English section shows the release history even though the
#      generated pages live in the default content language.
#
#  Every text field therefore carries both languages: `title` / `title_en`,
#  `notes` / `notes_en`.
#
#  There are deliberately more entries than `pagination.pagerSize` (2) so the
#  section exercises Hugo's pagination, including the windowed branch of
#  layouts/_partials/pagination.html that only runs past eight pages.
# ============================================================================

